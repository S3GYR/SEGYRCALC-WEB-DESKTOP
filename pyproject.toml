[project]
name = "segyrcalc-web-windows-packaging"
version = "0.9.0b1"
description = "Isolated SEGYRCALC web desktop Windows packaging candidate"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "pywebview==6.2.1",
  "pillow==13.0.0",
  "reportlab==5.1.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "psutil==7.2.2",
  "pypdf==7.0.1",
  "pymupdf==2.1",
  "pyinstaller==6.22.3",
  "playwright==1.65.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
